name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CloudBox.Client/**'
      - 'CloudBox.Core/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Import P12 certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k build build.keychain
          rm cert.p12

      - name: Install provisioning profile
        env:
          PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Publish iOS IPA
        run: |
          dotnet publish CloudBox.Client/CloudBox.Client.csproj \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="${{ secrets.IOS_SIGNING_KEY_NAME }}" \
            -p:CodesignProvision="${{ secrets.IOS_PROVISION_NAME }}" \
            -p:CodesignTeamId="${{ secrets.IOS_TEAM_ID }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CloudBox-iOS
          path: '**/*.ipa'
          if-no-files-found: error