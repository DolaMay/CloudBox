name: Build iOS (Unsigned for SideStore)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnose repository structure
        run: |
          echo "===== 当前工作目录 ====="
          pwd
          echo "===== 根目录内容 ====="
          ls -la
          echo "===== 子模块状态 ====="
          git submodule status
          echo "===== 查找所有 csproj ====="
          find . -name "*.csproj" -type f

      - name: Select Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [[ -z "${XCODE_APP:-}" ]]; then
            echo "Xcode 26 not found on this runner."
            ls /Applications | grep Xcode
            exit 1
          fi
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios --version 26.2.10233

      - name: Publish iOS App (No Codesign)
        run: |
          CSPROJ=$(find . -name "CloudBox.Client.csproj" -type f | head -n 1)
          if [ -z "$CSPROJ" ]; then
            echo "未找到 CloudBox.Client.csproj"
            exit 1
          fi
          echo "找到项目文件: $CSPROJ"

          dotnet publish "$CSPROJ" \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:EnableCodeSigning=false \
            -p:MtouchUseLlvm=false

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -type d -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app 文件"
            exit 1
          fi
          echo "找到 .app: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r CloudBox-unsigned.ipa Payload/
          ls -la CloudBox-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CloudBox-Unsigned-IPA
          path: CloudBox-unsigned.ipa
          if-no-files-found: error