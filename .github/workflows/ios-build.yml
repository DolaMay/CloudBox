name: Build iOS (Unsigned for SideStore)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'CloudBox.Client/**'
      - 'CloudBox.Core/**'

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Publish iOS App (No Codesign)
        run: |
          dotnet publish CloudBox.Client/CloudBox.Client.csproj \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:EnableCodeSigning=false \
            -p:MtouchUseLlvm=false

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          # 找到 .app 目录并复制到 Payload
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "未找到 .app 文件"; exit 1; fi
          cp -R "$APP_PATH" Payload/
          zip -r CloudBox-unsigned.ipa Payload/
          ls -la CloudBox-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CloudBox-Unsigned-IPA
          path: CloudBox-unsigned.ipa
          if-no-files-found: error
